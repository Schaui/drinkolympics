<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drinkolympics</title>
<meta name="theme-color" content="#1f538d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a1a; --card: #2b2b2b; --card2: #333; --text: #f2f2f2; --muted: #9a9a9a;
    --blue: #1f538d; --blue2: #3a7ebf; --green: #27ae60; --spotify: #1DB954; --red: #c0392b; --slate: #34495e;
    --orange: #d35400; --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32;
    --display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  header { background: var(--blue); padding: calc(14px + env(safe-area-inset-top)) 16px 14px; }
  header h1 { margin: 0; font: 34px/1 var(--display); letter-spacing: 1px; }
  main { padding: 12px 16px; max-width: 720px; margin: 0 auto; }
  .tab { display: none; } .tab.active { display: block; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font: 22px/1 var(--display); letter-spacing: .5px; }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; min-width: 0; }
  input, select { width: 100%; font: inherit; color: var(--text); background: #1f1f1f; border: 1px solid #555; border-radius: 8px; padding: 11px 12px; }
  input:focus, select:focus { outline: 2px solid var(--blue2); border-color: transparent; }
  button { font: 18px/1 var(--display); letter-spacing: .5px; color: #fff; background: var(--blue); border: 0; border-radius: 8px; padding: 12px 14px; cursor: pointer; }
  button:active { filter: brightness(1.2); }
  button:disabled { opacity: .45; }
  .b-green { background: var(--green); } .b-spotify { background: var(--spotify); } .b-red { background: var(--red); }
  .b-slate { background: var(--slate); } .b-orange { background: var(--orange); } .b-ghost { background: transparent; border: 1px solid #555; }
  .icon-btn { width: 44px; height: 44px; padding: 0; font: 20px/1 system-ui; flex: none; }
  .big { width: 100%; font-size: 30px; padding: 22px; margin: 6px 0 14px; }
  .list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .item { display: flex; align-items: center; gap: 8px; background: var(--card2); border-radius: 8px; padding: 6px 6px 6px 12px; }
  .item .grow { flex: 1; min-width: 0; }
  .item .name { font: 19px/1.2 var(--display); overflow-wrap: anywhere; }
  .item .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }
  .stack > * + * { margin-top: 8px; }
  .song-chip { display: flex; align-items: center; gap: 8px; background: #1f3a2a; border: 1px solid var(--spotify); border-radius: 8px; padding: 6px 6px 6px 10px; font-size: 14px; }
  .song-chip .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results { display: flex; flex-direction: column; gap: 4px; }
  .result { display: flex; align-items: center; gap: 10px; background: var(--card2); border-radius: 8px; padding: 6px; font: 15px/1.25 system-ui; text-align: left; letter-spacing: 0; }
  .result img { width: 40px; height: 40px; border-radius: 4px; flex: none; background: #444; }
  .result span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result small { color: var(--muted); }
  .status { font-size: 14px; padding: 8px 10px; border-radius: 8px; background: var(--card2); }
  .status.ok { background: #1f3a2a; } .status.warn { background: #4d3a16; } .status.err { background: #4d1a1a; }
  code.copy { display: block; background: #111; padding: 8px 10px; border-radius: 6px; font-size: 13px; overflow-wrap: anywhere; margin: 6px 0; }
  details summary { cursor: pointer; color: var(--blue2); font-size: 14px; margin-top: 8px; }
  ol.help { padding-left: 20px; margin: 8px 0; font-size: 14px; } ol.help li { margin: 4px 0; }

  .discipline { font: 34px/1.1 var(--display); color: var(--blue2); text-align: center; margin: 6px 0 4px; overflow-wrap: anywhere; }
  .progress { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .place-row { display: flex; align-items: center; gap: 10px; background: var(--card2); border-radius: 8px; padding: 8px 8px 8px 12px; margin-bottom: 8px; }
  .place-row .name { flex: 1; font: 21px/1.2 var(--display); overflow-wrap: anywhere; }
  .place-row input { width: 84px; text-align: center; font: 22px/1 var(--display); padding: 10px 6px; }
  .place-row input.bad { outline: 2px solid var(--red); }
  .place-row { flex-wrap: wrap; }
  .place-row .actions { flex-basis: 100%; display: flex; gap: 8px; }
  .place-row .actions button { flex: 1; font-size: 15px; padding: 9px 6px; }
  .place-row input:disabled { opacity: .35; }
  button.toggle[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
  .bonus-plus { color: #2ecc71; } .bonus-minus { color: #e74c3c; }
  .place-row .time-in { display: flex; align-items: center; gap: 4px; font: 22px/1 var(--display); }
  .place-row .time-in input { width: 64px; }
  .seg { display: flex; gap: 3px; background: #1f1f1f; border: 1px solid #555; border-radius: 8px; padding: 3px; }
  .seg button { flex: 1; background: transparent; color: var(--muted); font: 17px/1.2 var(--display); letter-spacing: .5px; padding: 9px 4px; }
  .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .score { display: flex; justify-content: space-between; padding: 6px 2px; border-bottom: 1px solid #3a3a3a; font-size: 15px; }
  .finished { text-align: center; font: 44px/1 var(--display); color: var(--gold); margin: 18px 0 6px; }
  .saved { text-align: center; color: #2ecc71; margin-bottom: 14px; }

  .log-view { white-space: pre-wrap; font: 13px/1.45 ui-monospace, Consolas, monospace; background: #111; border-radius: 8px; padding: 12px; overflow-x: auto; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #111; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1; background: transparent; border-radius: 0; padding: 10px 4px 12px; font: 13px/1.2 system-ui; color: var(--muted); letter-spacing: 0; }
  nav button span { display: block; font-size: 22px; margin-bottom: 2px; }
  nav button.active { color: #fff; background: #1d2a3a; }

  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #000; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }

  /* Siegerehrung */
  #ceremony { position: fixed; inset: 0; background: #000; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  #ceremony.open { display: flex; }
  #c-close { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; background: #222; width: 46px; height: 46px; padding: 0; border-radius: 50%; font: 22px/1 system-ui; }
  #c-rank { font: clamp(40px, 12vw, 110px)/1 var(--display); }
  #c-team { font: clamp(44px, 14vw, 130px)/1.05 var(--display); margin: 24px 0 8px; white-space: pre-line; overflow-wrap: anywhere; color: #333; }
  #c-team.winner { font-size: clamp(54px, 17vw, 160px); }
  #c-info { font: clamp(18px, 5vw, 34px)/1.2 var(--display); color: #aaa; min-height: 1.2em; white-space: pre-line; }
  #c-music { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  #c-next { margin-top: 28px; width: min(420px, 100%); font-size: 26px; padding: 18px; }

  /* Countdown */
  #countdown { position: fixed; inset: 0; background: #000; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  #countdown.open { display: flex; }
  #cd-close { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; background: #222; width: 46px; height: 46px; padding: 0; border-radius: 50%; font: 22px/1 system-ui; }
  #cd-spiel { font: 30px/1.1 var(--display); color: var(--blue2); overflow-wrap: anywhere; }
  #cd-zeit { font: clamp(96px, 34vw, 300px)/1 var(--display); color: #fff; margin: 10px 0; }
  #cd-zeit.warn { color: #e74c3c; }
  #cd-presets { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  #cd-presets button { background: var(--slate); font-size: 18px; padding: 10px 12px; }
  #cd-start { font-size: 28px; padding: 18px; }
</style>
</head>
<body>
<header><h1>DRINKOLYMPICS</h1></header>

<main>
  <!-- SETUP -->
  <section class="tab active" id="tab-setup">
    <div class="card" id="spotify-card"></div>

    <div class="card">
      <h2 id="spiel-form-title">Spiele</h2>
      <form class="stack" id="form-spiel">
        <div class="row">
          <input id="in-spiel" placeholder="Spiel hinzufügen…" autocomplete="off" enterkeyhint="done">
          <button type="submit" id="btn-spiel-save">+ Spiel</button>
        </div>
        <div class="seg" id="seg-art"><button type="button" data-v="punkte">🔢 Punkte</button><button type="button" data-v="zeit">⏱ Zeit</button></div>
        <div class="seg" id="seg-besser"><button type="button" data-v="hoch">Mehr gewinnt</button><button type="button" data-v="niedrig">Weniger gewinnt</button></div>
        <button type="button" class="b-ghost" id="btn-spiel-cancel" style="width:100%" hidden>Abbrechen</button>
      </form>
      <div class="list" id="list-spiele"></div>
    </div>

    <div class="card">
      <h2 id="team-form-title">Team hinzufügen</h2>
      <form class="stack" id="form-team">
        <input id="in-team" placeholder="Teamname…" autocomplete="off" enterkeyhint="next">
        <div id="song-picker"></div>
        <div class="row">
          <button type="submit" class="b-green" id="btn-team-save" style="flex:1">+ Team</button>
          <button type="button" class="b-ghost" id="btn-team-cancel" hidden>Abbrechen</button>
        </div>
      </form>
      <div class="list" id="list-teams"></div>
    </div>

    <div class="card">
      <h2>Austausch mit dem PC</h2>
      <p class="muted" style="margin-top:0">Schickt Spiele, Teams, Punkte und alle Protokolle an die PC-Version – z. B. per WhatsApp an dich selbst. Am PC dann bei „📥 VOM HANDY“ einfügen.</p>
      <button class="b-slate" id="btn-an-pc" style="width:100%">💻 AN DEN PC SENDEN</button>
    </div>

    <button class="big b-green" id="btn-start">LASST DIE SPIELE BEGINNEN</button>
  </section>

  <!-- WETTKAMPF -->
  <section class="tab" id="tab-game"></section>

  <!-- PROTOKOLLE -->
  <section class="tab" id="tab-logs"></section>
</main>

<nav>
  <button data-tab="setup" class="active"><span>⚙️</span>Setup</button>
  <button data-tab="game"><span>🏆</span>Wettkampf</button>
  <button data-tab="logs"><span>📜</span>Protokolle</button>
</nav>

<div id="ceremony">
  <button id="c-close" aria-label="Siegerehrung schließen">✕</button>
  <div id="c-rank">DIE SIEGEREHRUNG</div>
  <div id="c-team">Bereit?</div>
  <div id="c-info"></div>
  <div id="c-music"></div>
  <button id="c-next">START</button>
</div>

<div id="countdown">
  <button id="cd-close" aria-label="Countdown schließen">✕</button>
  <div id="cd-spiel"></div>
  <div id="cd-zeit">1:00</div>
  <div id="cd-presets"></div>
  <div class="row" style="width:min(420px,100%)">
    <button id="cd-start" class="b-green" style="flex:1">▶ START</button>
    <button id="cd-reset" class="b-slate">↺ RESET</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const SPANNUNG_SEKUNDEN = 5;   // Countdown bei der Siegerehrung, bevor der Name erscheint
const STATE_KEY = "drinkolympics_v1";
const SPOTIFY_KEY = "drinkolympics_spotify_v1";
const SCOPES = "user-read-playback-state user-modify-playback-state";
const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, "");

// ---------- kleine Helfer ----------
const $ = (s) => document.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
function toast(msg, ms = 2600) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), ms);
}
function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function store(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { toast("Speichern fehlgeschlagen!"); }
}
const sameName = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------- Spielstand (bleibt auf dem Handy gespeichert) ----------
// bonus: [{team, punkte, grund}] · uhren: laufende Stoppuhren {Team-Nr.: Startzeit in ms}
const S = Object.assign({ teams: [], spiele: [], current: 0, draft: {}, logFile: null, protokolle: [], bonus: [], uhren: {} }, load(STATE_KEY, {}));
function save() { store(STATE_KEY, S); }

// ---------- Wertung ----------
// Ein Spiel: {name, art: "punkte" | "zeit", besser: "hoch" (mehr gewinnt) | "niedrig" (weniger gewinnt)}
const neuesSpiel = (name, art = "punkte", besser) => ({ name, art: art === "zeit" ? "zeit" : "punkte",
  besser: besser === "hoch" || besser === "niedrig" ? besser : art === "zeit" ? "niedrig" : "hoch" });
// Ältere Stände kennen nur den Spielnamen – die werden als „mehr Punkte gewinnt“ übernommen
const spielAusDaten = (s) => typeof s === "string" ? neuesSpiel(s) : neuesSpiel(s.name || "", s.art, s.besser);
S.spiele = S.spiele.map(spielAusDaten);
const wertungText = (s) => (s.art === "zeit" ? "Zeit" : "Punkte") + " – " + (s.besser === "hoch" ? "mehr" : "weniger") + " gewinnt";
const wertungIcon = (s) => (s.art === "zeit" ? "⏱ " : "🔢 ");
// Punkte: Zahl (Komma oder Punkt). Zeit: Sekunden ("83,5") oder Minuten:Sekunden ("1:23,5", auch "1:02:03").
function parseWert(text, art) {
  const t = String(text ?? "").trim().replace(/,/g, ".");
  if (!t) return null;
  const zahl = (x) => (/^-?(\d+\.?\d*|\.\d+)$/.test(x) ? Number(x) : NaN);
  let v;
  if (art === "zeit" && t.includes(":")) {
    const teile = t.split(":").map(zahl);
    if (teile.length > 3 || teile.some((x) => !(x >= 0)) || teile.slice(1).some((x) => x >= 60)) return null;
    v = teile.reduce((a, x) => a * 60 + x, 0);
  } else v = zahl(t);
  if (!Number.isFinite(v) || (art === "zeit" && v < 0)) return null;
  return v;
}
const DNF = "DNF";   // gespeichertes Ergebnis für „nicht geschafft“
function formatWert(v, art) {
  if (v == null) return "–";
  if (v === DNF) return "nicht geschafft";
  v = Math.round(v * 100) / 100;
  if (art !== "zeit") return String(v).replace(".", ",");
  const ganz = Math.floor(v), nach = (v - ganz).toFixed(2).slice(1).replace(/0+$/, "").replace(/\.$/, "").replace(".", ",");
  const h = Math.floor(ganz / 3600), m = Math.floor((ganz % 3600) / 60), s = ganz % 60, p2 = (x) => String(x).padStart(2, "0");
  return h ? `${h}:${p2(m)}:${p2(s)}${nach}` : m ? `${m}:${p2(s)}${nach}` : `${s}${nach} s`;
}
// Ergebnis so, wie es ins Eingabefeld gehört: Zeit als "Minuten:Sekunden" bzw. nur Sekunden, z.B. "1:23,5" oder "45,3"
function eingabeText(v, art) {
  if (v === DNF) return DNF;
  if (art !== "zeit") return formatWert(v, art);
  const m = Math.floor(Math.round(v * 100) / 100 / 60), s = formatWert(Math.max(0, v - m * 60), "zeit").replace(" s", "");
  if (!m) return s;
  const [ganz, nach] = s.split(",");
  return `${m}:${ganz.padStart(2, "0")}${nach ? "," + nach : ""}`;
}
// Bester bekommt so viele Punkte, wie es Teams gibt, der Zweite einen weniger usw. Gleiche Werte teilen sich den Platz.
// null = nicht geschafft: diese Teams teilen sich den letzten Platz.
function punkteVergeben(werte, besser) {
  const n = werte.length, fertig = [...werte.keys()].filter((i) => werte[i] != null)
    .sort((a, b) => (besser === "hoch" ? werte[b] - werte[a] : werte[a] - werte[b]));
  const punkte = Array(n).fill(n - fertig.length);
  let platz = 0;
  fertig.forEach((i, rang) => {
    if (rang === 0 || werte[i] !== werte[fertig[rang - 1]]) platz = rang + 1;
    punkte[i] = n + 1 - platz;
  });
  return punkte;
}

// ---------- Spotify ----------
// Client-ID der Drinkolympics-App im Spotify-Dashboard (nicht geheim). Wer dort unter
// „User Management“ eingetragen ist, muss nur noch auf „Verbinden“ tippen.
const STANDARD_CLIENT_ID = "7cf3e01f486449d7aadec9f752986e20";
const SP = Object.assign({ clientId: STANDARD_CLIENT_ID, access: "", refresh: "", expires: 0, deviceId: "", user: "" }, load(SPOTIFY_KEY, {}));
function saveSP() { store(SPOTIFY_KEY, SP); }
const spotifyConnected = () => !!SP.refresh;

function trackId(link) {
  const m = /(?:open\.spotify\.com\/(?:intl-[a-z-]+\/)?track\/|spotify:track:)([A-Za-z0-9]{22})/i.exec(link || "");
  return m ? m[1] : null;
}
function randomString(n) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(n)), (x) => chars[x % chars.length]).join("");
}
async function sha256url(text) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

// Login mit PKCE: kein Geheimnis im Code nötig, nur die Client-ID
async function spotifyLogin() {
  const verifier = randomString(64), state = randomString(16);
  localStorage.setItem("drinkolympics_pkce", JSON.stringify({ verifier, state }));
  const p = new URLSearchParams({
    response_type: "code", client_id: SP.clientId, scope: SCOPES, redirect_uri: REDIRECT_URI, state,
    code_challenge_method: "S256", code_challenge: await sha256url(verifier),
  });
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
async function tokenRequest(params) {
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: SP.clientId, ...params }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.error || "Token-Fehler " + r.status);
  SP.access = j.access_token; SP.expires = Date.now() + (j.expires_in - 60) * 1000;
  if (j.refresh_token) SP.refresh = j.refresh_token;
  saveSP();
}
async function handleRedirect() {
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return;
  history.replaceState(null, "", REDIRECT_URI);
  const pkce = JSON.parse(localStorage.getItem("drinkolympics_pkce") || "{}");
  localStorage.removeItem("drinkolympics_pkce");
  if (q.has("error")) { toast("Spotify-Login abgebrochen"); return; }
  if (q.get("state") !== pkce.state) { toast("Spotify-Login ungültig, bitte nochmal"); return; }
  try {
    await tokenRequest({ grant_type: "authorization_code", code: q.get("code"), redirect_uri: REDIRECT_URI, code_verifier: pkce.verifier });
    const me = await api("GET", "/me");
    if (me.status === 403) {   // Konto steht nicht unter „User Management“ der Spotify-App
      spotifyLogout();
      toast("Dein Spotify-Konto ist für diese App nicht freigeschaltet – frag den Organisator", 6000);
      return;
    }
    if (me.ok) { SP.user = (await me.json()).display_name || ""; saveSP(); }
    toast("Mit Spotify verbunden ✅");
  } catch (e) { toast("Spotify-Login fehlgeschlagen: " + e.message, 5000); }
}
async function api(method, path, body, retry = true) {
  if (!spotifyConnected()) throw new Error("nicht verbunden");
  if (Date.now() > SP.expires) await tokenRequest({ grant_type: "refresh_token", refresh_token: SP.refresh });
  const r = await fetch("https://api.spotify.com/v1" + path, {
    method, headers: { Authorization: "Bearer " + SP.access, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401 && retry) { SP.expires = 0; return api(method, path, body, false); }
  return r;
}
function spotifyLogout() {

// Abspielgerät: gewähltes Gerät (per ID oder Name), sonst das aktive, sonst ein Handy, sonst das erste.
// Die Spotify-App am Handy taucht nur in der Liste auf, solange sie offen ist – darum merken wir uns
// das zuletzt benutzte Gerät und versuchen es auch dann, wenn die Liste leer ist.
let devices = [];
async function loadDevices() {
  const r = await api("GET", "/me/player/devices");
  devices = r.ok ? (await r.json()).devices || [] : [];
  return devices;
}
async function pickDevice() {
  const list = await loadDevices();
  return list.find((d) => d.id === SP.deviceId) || (SP.deviceName && list.find((d) => d.name === SP.deviceName))
      || list.find((d) => d.is_active) || list.find((d) => d.type === "Smartphone") || list[0]
      || (SP.lastDevice ? { id: SP.lastDevice } : null);
}
// Was spielt Spotify gerade? null, wenn kein Gerät aktiv ist.
async function playerState() {
  const r = await api("GET", "/me/player");
  return r.status === 200 ? r.json().catch(() => null) : null;
}
// Jeder Start/Stopp erhöht den Zähler, damit eine ältere Kontrolle nicht den falschen Song weiterlaufen lässt
let playSeq = 0;
// Startet einen Song von vorne. Liefert "ok", "nicht-verbunden", "kein-geraet" oder "fehler".
async function playTrack(id) {
  if (!spotifyConnected()) return "nicht-verbunden";
  const my = ++playSeq;
  try {
    const dev = await pickDevice();
    if (!dev) return "kein-geraet";
    const r = await api("PUT", "/me/player/play?device_id=" + encodeURIComponent(dev.id), { uris: ["spotify:track:" + id], position_ms: 0 });
    if (!r.ok) return r.status === 404 ? "kein-geraet" : "fehler";
    if (SP.lastDevice !== dev.id) { SP.lastDevice = dev.id; saveSP(); }
    weiterlaufenLassen(id, dev.id, my);
    return "ok";
  } catch { return "fehler"; }
}
// Das iPhone-Spotify im Hintergrund bleibt beim Songwechsel manchmal stehen –
// darum kurz danach nachsehen und die Wiedergabe notfalls wieder anschieben.
async function weiterlaufenLassen(id, devId, my) {
  for (let i = 0; i < 4; i++) {
    await sleep(1500);
    if (my !== playSeq) return;
    try {
      const st = await playerState();
      if (my !== playSeq) return;
      if (st?.is_playing && st.item?.id === id) return;
      if (st?.item?.id === id) await api("PUT", "/me/player/play?device_id=" + encodeURIComponent(devId));   // nur fortsetzen
      else await api("PUT", "/me/player/play?device_id=" + encodeURIComponent(devId), { uris: ["spotify:track:" + id], position_ms: 0 });
    } catch { /* nächster Versuch */ }
  }
}
// Öffnet die Spotify-App, damit sie als Gerät auftaucht. Kommt man zurück, startet der Song automatisch.
let nachholen = null;
function spotifyAppOeffnen(id) {
  nachholen = id || null;
  location.href = id ? "spotify:track:" + id : "spotify:";
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !spotifyConnected()) return;
  if ($("#tab-setup")?.classList.contains("active")) renderSpotify();   // Geräteliste auffrischen
  if (!nachholen) return;
  const id = nachholen; nachholen = null;
  for (let i = 0; i < 5; i++) {   // die Spotify-App braucht nach dem Öffnen kurz, bis sie gemeldet ist
    // Läuft der Song schon (in Spotify gestartet), nicht nochmal starten – das würde ihn unterbrechen
    const st = await playerState().catch(() => null);
    if (st?.is_playing && st.item?.id === id) {
      if (st.device?.id && SP.lastDevice !== st.device.id) { SP.lastDevice = st.device.id; saveSP(); }
      toast("▶ Musik läuft"); return;
    }
    if ((await playTrack(id)) === "ok") { toast("▶ Musik läuft"); return; }
    await sleep(1500);
  }

});

  punkteVergeben(werte.map((v) => (v === DNF ? null : v)), s.besser).forEach((p, j) => { const t = S.teams[j]; t.points += p - (t.history[s.name] || 0); t.history[s.name] = p; });

function rangliste() {
  // [[platz, team], ...] – punktgleiche Teams teilen sich den Platz
  const r = [...S.teams].sort((a, b) => b.points - a.points), out = [];
  r.forEach((t, i) => out.push([out.length && out.at(-1)[1].points === t.points ? out.at(-1)[0] : i + 1, t]));
  return out;
}
function renderGame() {
  const g = $("#tab-game"); g.replaceChildren();
  if (!S.spiele.length || !S.teams.length) { g.append(el("div", { class: "card empty" }, "Bitte erst Teams und Spiele im Setup anlegen!")); return; }
  if (S.current >= S.spiele.length) { renderFinal(); return; }

  const akt = S.spiele[S.current], zeit = akt.art === "zeit", last = S.current === S.spiele.length - 1;
  g.append(el("div", { class: "discipline" }, "DISZIPLIN: " + akt.name.toUpperCase()),

           el("button", { class: "b-orange", style: "width:100%;margin-bottom:12px", onclick: openCountdown }, "⏳ COUNTDOWN"));
  // Je Team ein Feld für die Punkte bzw. zwei Felder (Minuten und Sekunden) für die Zeit,
  // darunter Stoppuhr (nur bei Zeit) und „nicht geschafft“
  uhrFelder = {};

    const dnf = S.draft[i] === DNF, d = dnf ? "" : S.draft[i] ?? "";
    let felder, wert;

      const si = el("input", { inputmode: "decimal", placeholder: "sek", value: k < 0 ? d : d.slice(k + 1), "aria-label": "Sekunden für " + t.name });
      felder = [mi, si]; uhrFelder[i] = felder;
      wert = () => { const m = mi.value.trim(), s = si.value.trim(); return m ? `${m}:${s || "0"}` : s; };
    } else {
      const inp = el("input", { inputmode: "decimal", placeholder: "Punkte", value: d, "aria-label": "Punkte für " + t.name });
      felder = [inp];
      wert = () => inp.value.trim();
    }

      f.disabled = dnf;
      f.addEventListener("input", () => { S.draft[i] = wert(); felder.forEach((x) => x.classList.remove("bad")); save(); });

const pad = (s, n) => (s + " ".repeat(n)).slice(0, Math.max(n, s.length));

function protokollAktualisieren() {
  const p = S.protokolle.find((x) => x.name === S.logFile);
  if (p && S.current >= S.spiele.length) { p.text = protokollText(new Date(p.datum)); save(); }

function protokollText(now) {
  const d = now.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
  const tm = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const lines = [`DRINKOLYMPICS ${now.getFullYear()}`, `${d} ${tm}`, "=".repeat(35), "RANKING:"];
  for (const [p, t] of rangliste()) lines.push(`${p}. ${pad(t.name, 20)} | ${t.points} Pkt`);
  lines.push("", "DISZIPLINEN:");
  for (const s of S.spiele) {
    lines.push("", `${s.name.toUpperCase()} (${wertungText(s)}):`);
    [...S.teams].sort((a, b) => (b.history[s.name] || 0) - (a.history[s.name] || 0)).forEach((t) => {
      const v = t.werte?.[s.name];
      lines.push(` - ${pad(t.name, 20)}: ${t.history[s.name] || 0} Pkt` + (v != null ? `  (${formatWert(v, s.art)})` : ""));
    });
  }
  if (S.bonus.length) {
    lines.push("", "BONUS / STRAFEN:");
    for (const b of S.bonus) lines.push(` - ${pad(b.team, 20)}: ${b.punkte > 0 ? "+" : ""}${b.punkte} Pkt` + (b.grund ? `  (${b.grund})` : ""));

  return lines.join("\n") + "\n";
}

// ---------- SIEGEREHRUNG ----------
let wakeLock = null;
function openCeremony() {
  // Teams nach Platz gruppieren – bei Gleichstand stehen mehrere Teams auf einem Platz
  const gruppen = {};
  for (const [p, t] of rangliste()) if (p <= 3) (gruppen[p] ||= []).push(t);
  const reihenfolge = Object.keys(gruppen).map(Number).sort((a, b) => b - a);   // z.B. [3, 2, 1]
  const farben = { 1: "var(--gold)", 2: "var(--silver)", 3: "var(--bronze)" };
  const C = $("#ceremony"), rank = $("#c-rank"), team = $("#c-team"), info = $("#c-info"), music = $("#c-music"), next = $("#c-next");
  let run = 0;   // erhöht sich bei jedem Schritt, damit alte Countdowns abbrechen

  rank.textContent = "DIE SIEGEREHRUNG"; rank.style.color = "#fff";
  team.textContent = "Bereit?"; team.className = ""; team.style.color = "#333";
  info.textContent = ""; music.replaceChildren();
  stopMusic();
  // Vorab prüfen, ob Spotify ein Gerät hat – sonst gleich hier die Spotify-App öffnen lassen
  if (spotifyConnected() && reihenfolge.some((p) => gruppen[p].some((t) => t.songId))) {
    loadDevices().then((list) => {
      if (list.length || run > 0) return;
      info.textContent = "Spotify findet gerade kein Abspielgerät.\nÖffne kurz die Spotify-App und komm zurück.";
      music.replaceChildren(spotifyKnopf());
    }).catch(() => {});
  }
  C.classList.add("open");
  C.requestFullscreen?.().catch(() => {});
  navigator.wakeLock?.request("screen").then((w) => (wakeLock = w)).catch(() => {});

  const label = (p) => (p === 1 ? "DEN SIEGER ENTHÜLLEN!" : `${p}. PLATZ ENTHÜLLEN`);
  const setNext = (pos) => {
    if (pos < reihenfolge.length) {
      next.textContent = label(reihenfolge[pos]); next.className = reihenfolge[pos] === 1 ? "b-orange" : "";
      next.onclick = () => reveal(pos);
    } else { next.textContent = "ZURÜCK ZUM MENÜ"; next.className = "b-slate"; next.onclick = close; }
    next.hidden = false;
  };
  async function reveal(pos) {
    const my = ++run, platz = reihenfolge[pos], teams = gruppen[platz];
    rank.textContent = platz === 1 ? "🏆 1. PLATZ 🏆" : `${platz}. PLATZ`; rank.style.color = farben[platz];
    info.textContent = ""; music.replaceChildren(); next.hidden = true;
    // Erst Musik starten (Song vom vorherigen Platz endet dabei), dann Spannung aufbauen
    // Ohne Song gibt es stattdessen Trommelwirbel und Tusch
    const mitSong = teams.find((t) => t.songId);
    sfxStopp();
    const musikErgebnis = mitSong ? playTrack(mitSong.songId) : stopMusic().then(() => "ok");
    if (!mitSong) trommelwirbel(SPANNUNG_SEKUNDEN);
    for (let n = SPANNUNG_SEKUNDEN; n > 0; n--) {
      team.className = ""; team.style.color = "#555"; team.textContent = "🥁 " + n;
      await sleep(1000); if (my !== run) return;
    }
    if (!mitSong) tusch();
    team.textContent = teams.map((t) => t.name).join("\n");
    team.className = platz === 1 ? "winner" : ""; team.style.color = platz === 1 ? farben[1] : "#fff";
    info.textContent = teams.length > 1 ? "GLEICHSTAND!" : "";
    for (const t of teams.filter((t) => t.songId)) {
      music.append(el("button", { class: "b-spotify", onclick: () => preview(t.songId) }, teams.length > 1 ? "🎵 " + t.name : "🎵 MUSIK NOCHMAL"));
    }
    const res = await musikErgebnis;
    if (my !== run) return;
    if (res !== "ok") info.textContent = (info.textContent ? info.textContent + "\n" : "") + "(" + musicProblem(res) + ")";
    if (res === "kein-geraet") music.append(spotifyKnopf(mitSong.songId));
    setNext(pos + 1);
  }
  function close() {
    run++; C.classList.remove("open"); stopMusic(); sfxStopp();
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    wakeLock?.release().catch(() => {}); wakeLock = null;
  }
  $("#c-close").onclick = close;
  document.onkeydown = (e) => { if (e.key === "Escape" && C.classList.contains("open")) close(); };
  setNext(0);
}

// ---------- Sounds: Trommelwirbel, Tusch und Pieptöne – direkt im Browser erzeugt ----------
let audioCtx = null, sfxNodes = [], rauschen = null;
function audio() {
  audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function sfxStopp() {
  for (const n of sfxNodes) { try { n.stop(); } catch { /* schon zu Ende */ } }
  sfxNodes = [];
}
// Schnell aufeinanderfolgende Schläge, immer dichter und lauter
function trommelwirbel(dauer) {
  const a = audio(), t0 = a.currentTime + 0.02;
  if (!rauschen) {
    rauschen = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const d = rauschen.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  for (let t = 0; t < dauer; t += 0.11 - 0.075 * (t / dauer)) {
    const src = a.createBufferSource(), filter = a.createBiquadFilter(), g = a.createGain();
    src.buffer = rauschen; filter.type = "bandpass"; filter.frequency.value = 1800; filter.Q.value = 0.7;
    g.gain.setValueAtTime(0.4 + 0.9 * (t / dauer), t0 + t); g.gain.exponentialRampToValueAtTime(0.001, t0 + t + 0.06);
    src.connect(filter).connect(g).connect(a.destination);
    src.start(t0 + t, Math.random() * 0.8, 0.07); sfxNodes.push(src);
  }
}
// Kurze Fanfare: G – C – E – langes G mit Akkord
function tusch() {
  const a = audio(), t0 = a.currentTime + 0.02, noten = [[392, 0.13], [523, 0.13], [659, 0.13], [784, 1.1]];
  let t = 0;
  noten.forEach(([f, d], i) => {
    const letzte = i === noten.length - 1;
    for (const ton of letzte ? [f, f * 1.26, f * 1.5] : [f]) {
      const o = a.createOscillator(), filter = a.createBiquadFilter(), g = a.createGain();
      o.type = "sawtooth"; o.frequency.value = ton; filter.type = "lowpass"; filter.frequency.value = 2400;
      g.gain.setValueAtTime(0, t0 + t); g.gain.linearRampToValueAtTime(letzte ? 0.12 : 0.18, t0 + t + 0.02);
      if (letzte) g.gain.exponentialRampToValueAtTime(0.001, t0 + t + d);
      else { g.gain.setValueAtTime(0.18, t0 + t + d - 0.02); g.gain.linearRampToValueAtTime(0, t0 + t + d); }
      o.connect(filter).connect(g).connect(a.destination);
      o.start(t0 + t); o.stop(t0 + t + d + 0.05); sfxNodes.push(o);
    }
    t += d;
  });
}
function piep(freq, dauer) {
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime;
  o.type = "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.2, t0); g.gain.setValueAtTime(0.2, t0 + dauer - 0.02); g.gain.linearRampToValueAtTime(0, t0 + dauer);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dauer);
}

// ---------- COUNTDOWN (Vollbild, z.B. „60 Sekunden so viele Becher wie möglich“) ----------
const CD = { rest: 0, ende: null, piep: null, timer: null };
function openCountdown() {
  CD.ende = null; CD.rest = S.countdown || 60;
  $("#cd-spiel").textContent = S.current < S.spiele.length ? S.spiele[S.current].name.toUpperCase() : "";
  $("#countdown").classList.add("open");
  $("#countdown").requestFullscreen?.().catch(() => {});
  navigator.wakeLock?.request("screen").then((w) => (wakeLock = w)).catch(() => {});
  cdZeigen();
}
function cdZeigen() {
  const sek = Math.ceil(CD.rest), z = $("#cd-zeit");
  z.textContent = sek <= 0 ? "ZEIT!" : sek >= 60 ? `${Math.floor(sek / 60)}:${String(sek % 60).padStart(2, "0")}` : String(sek);
  z.classList.toggle("warn", sek <= 10);
  $("#cd-start").textContent = CD.ende ? "⏸ PAUSE" : CD.rest > 0 && CD.rest < (S.countdown || 60) ? "▶ WEITER" : "▶ START";
}
function cdTick() {
  if (!CD.ende) return;
  CD.rest = Math.max(0, (CD.ende - Date.now()) / 1000);
  const sek = Math.ceil(CD.rest);
  if (sek > 0 && sek <= 3 && sek !== CD.piep) { CD.piep = sek; piep(880, 0.15); }   // die letzten drei Sekunden
  if (CD.rest <= 0) { CD.ende = null; piep(1320, 0.9); navigator.vibrate?.([300, 100, 300]); }
  cdZeigen();
  if (CD.ende) CD.timer = setTimeout(cdTick, 50);
}
function cdStartPause() {
  audio();   // Ton freischalten – geht auf dem Handy nur direkt nach einem Tippen
  if (CD.ende) { CD.rest = Math.max(0, (CD.ende - Date.now()) / 1000); CD.ende = null; clearTimeout(CD.timer); cdZeigen(); return; }
  if (CD.rest <= 0) CD.rest = S.countdown || 60;
  CD.ende = Date.now() + CD.rest * 1000; CD.piep = null; cdTick();
}
function cdSetzen(sek) {
  S.countdown = Math.max(5, sek); save();   // beim nächsten Mal wieder diese Zeit
  CD.ende = null; clearTimeout(CD.timer); CD.rest = S.countdown; cdZeigen();
}
function closeCountdown() {
  CD.ende = null; clearTimeout(CD.timer); $("#countdown").classList.remove("open");
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  wakeLock?.release().catch(() => {}); wakeLock = null;
}
$("#cd-presets").append(
  el("button", { onclick: () => cdSetzen((S.countdown || 60) - 10) }, "−10"),
  ...[[30, "30 S"], [60, "1 MIN"], [90, "1:30"], [120, "2 MIN"], [180, "3 MIN"]].map(([s, txt]) => el("button", { onclick: () => cdSetzen(s) }, txt)),
  el("button", { onclick: () => cdSetzen((S.countdown || 60) + 10) }, "+10"));
$("#cd-start").addEventListener("click", cdStartPause);
$("#cd-reset").addEventListener("click", () => cdSetzen(S.countdown || 60));
$("#cd-close").addEventListener("click", closeCountdown);

// ---------- Turnier an den PC senden (Text mit #import=..., am PC bei „📥 VOM HANDY“ einfügen) ----------
async function anPcSenden() {
  const daten = { v: 1, spiele: S.spiele, current: S.current, draft: S.draft, bonus: S.bonus, logFile: S.logFile, protokolle: S.protokolle,
    teams: S.teams.map((t) => ({ name: t.name, points: t.points, history: t.history, werte: t.werte || {}, songId: t.songId || "" })) };
  const gepackt = new Uint8Array(await new Response(new Blob([JSON.stringify(daten)]).stream().pipeThrough(new CompressionStream("deflate"))).arrayBuffer());
  let bin = ""; for (const b of gepackt) bin += String.fromCharCode(b);
  const text = `Drinkolympics für den PC (am PC bei „📥 VOM HANDY“ einfügen):\n${REDIRECT_URI}#import=` +
    btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text); toast("Kopiert – am PC bei „📥 VOM HANDY“ einfügen", 4000); }
  catch { prompt("Diesen Text kopieren und an den PC schicken:", text); }
}
$("#btn-an-pc").addEventListener("click", anPcSenden);

// ---------- Turnier vom PC übernehmen (QR-Code / Link mit #import=...) ----------
async function handleImport() {
  if (!location.hash.startsWith("#import=")) return;
  const code = location.hash.slice(8);
  history.replaceState(null, "", location.pathname + location.search);
  try {
    const b64 = code.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (code.length % 4)) % 4);
    const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
    const d = JSON.parse(text);
    if (!Array.isArray(d.teams) || !Array.isArray(d.spiele)) throw new Error("kein Turnier");
    const info = `${d.spiele.length} Spiele, ${d.teams.length} Teams` + (d.current > 0 ? `, ${d.current} schon gespielt` : "");
    if ((S.teams.length || S.spiele.length) && !confirm(`Turnier vom PC übernehmen? (${info})\nDer aktuelle Stand auf dem Handy wird ersetzt.`)) return;
    Object.assign(S, {
      spiele: d.spiele.map(spielAusDaten), current: d.current || 0, draft: d.draft || {}, bonus: d.bonus || [],
      uhren: {}, logFile: null,
      teams: d.teams.map((t) => ({ name: t.name, points: t.points || 0, history: t.history || {}, werte: t.werte || {},
        songId: t.songId || "", songName: t.songId ? "Spotify-Song" : "" })),
    });
    save();
    toast(`Turnier übernommen ✅ (${info})`, 4000);
  } catch { toast("Der Link vom PC ist ungültig oder unvollständig", 4000); }
}
// Songtitel nachladen, die nur als Link vom PC kamen
async function songNamenNachladen() {
  if (!spotifyConnected()) return;
  for (const t of S.teams.filter((t) => t.songId && t.songName === "Spotify-Song")) {
    try { const r = await api("GET", "/tracks/" + t.songId); if (r.ok) { t.songName = songLabel(await r.json()); save(); renderTeams(); } } catch {}
  }
}

// ---------- Start ----------
(async () => {
  await handleRedirect();
  await handleImport();
  renderSpotify(); renderWahl(); renderSpiele(); renderSongPicker(); renderTeams();
  if (S.current > 0 || Object.keys(S.draft).length) showTab("game");   // laufendes Turnier direkt zeigen
  songNamenNachladen();
})();
</script>
